http {
    # Настройка Rate Limiting: ограничение до 10 запросов в минуту
    # $binary_remote_addr - IP-адрес клиента (ключ для идентификации)
    # zone=api_limit:10m - зона общей памяти размером 10МБ для хранения состояний
    # rate=10r/m - максимальная частота запросов: 10 запросов в минуту
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/m;

    # Настройка upstream для балансировки нагрузки
    upstream backend_servers {
        server backend1.example.com;
        server backend2.example.com;
        server backend3.example.com;
    }

    server {
        listen 80;

        location / {
            # Применяем ограничение скорости запросов
            limit_req zone=api_limit;
            
            # Возвращаем код 429 (Too Many Requests) при превышении лимита
            # По умолчанию NGINX возвращает 503, но стандарт предполагает 429
            limit_req_status 429;
            
            proxy_pass http://backend_servers;
        }

    }
}
