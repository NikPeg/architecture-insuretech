# GraphQL Schema для сервиса управления клиентскими данными
# Преобразование из REST API в GraphQL для оптимизации взаимодействия

# Основная сущность - Клиент
# Содержит базовую информацию и связанные коллекции документов и родственников
type Client {
  # Уникальный идентификатор клиента
  id: ID!
  
  # Имя клиента
  name: String!
  
  # Возраст клиента
  age: Int!
  
  # Список документов клиента (опционально запрашивается)
  # Позволяет избежать отдельного запроса GET /clients/{id}/documents
  documents: [Document!]!
  
  # Список родственников клиента (опционально запрашивается)
  # Позволяет избежать отдельного запроса GET /clients/{id}/relatives
  relatives: [Relative!]!
}

# Сущность документа клиента
type Document {
  # Уникальный идентификатор документа
  id: ID!
  
  # Тип документа (паспорт, водительское удостоверение и т.д.)
  type: String!
  
  # Номер документа
  number: String!
  
  # Дата выдачи документа (ISO 8601 формат)
  issueDate: String!
  
  # Дата окончания действия документа (ISO 8601 формат, опционально)
  expiryDate: String
}

# Сущность родственника клиента
type Relative {
  # Уникальный идентификатор родственника
  id: ID!
  
  # Тип родства (отец, мать, супруг, ребенок и т.д.)
  relationType: String!
  
  # Имя родственника
  name: String!
  
  # Возраст родственника
  age: Int!
}

# Корневой тип запросов
type Query {
  # Получить информацию о клиенте по ID
  # Эквивалент GET /clients/{id}, но с возможностью гибкого выбора полей
  # 
  # Примеры использования:
  # 
  # 1. Только базовая информация о клиенте:
  # query {
  #   client(id: "123") {
  #     id
  #     name
  #     age
  #   }
  # }
  # 
  # 2. Клиент с документами, но без родственников:
  # query {
  #   client(id: "123") {
  #     id
  #     name
  #     documents {
  #       id
  #       type
  #       number
  #     }
  #   }
  # }
  # 
  # 3. Клиент с родственниками, но без документов:
  # query {
  #   client(id: "123") {
  #     id
  #     name
  #     relatives {
  #       id
  #       name
  #       relationType
  #     }
  #   }
  # }
  # 
  # 4. Полная информация о клиенте:
  # query {
  #   client(id: "123") {
  #     id
  #     name
  #     age
  #     documents {
  #       id
  #       type
  #       number
  #       issueDate
  #       expiryDate
  #     }
  #     relatives {
  #       id
  #       relationType
  #       name
  #       age
  #     }
  #   }
  # }
  client(id: ID!): Client
}

# Преимущества GraphQL решения:
# 
# 1. Снижение количества запросов к серверу
#    - Вместо 3 отдельных REST запросов (клиент, документы, родственники) 
#      можно сделать 1 GraphQL запрос
# 
# 2. Гибкость в выборе данных
#    - Клиент может запросить только те данные, которые ему нужны
#    - Нет over-fetching (получения лишних данных)
#    - Нет under-fetching (необходимости делать дополнительные запросы)
# 
# 3. Снижение нагрузки на сеть
#    - Передается только то, что действительно нужно
#    - Особенно критично для клиентов с карточкой из 500+ атрибутов
# 
# 4. Уменьшение RPS на сервис client-info
#    - Вместо множественных запросов для разных сценариев - один запрос
#    - Снижается нагрузка на backend и базу данных
# 
# 5. Версионирование API
#    - GraphQL схема позволяет добавлять новые поля без breaking changes
#    - Deprecated поля могут сосуществовать с новыми
